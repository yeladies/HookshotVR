name: VR bootstrap (no game data)
on:
  push:
    branches: [vr/bootstrap]
    paths: ['vr/**', 'gpu/vk/vk_xr.*', 'gpu/vk/vk_xr_session.h', 'gpu/vk/vk_xr_preview.h', 'gpu/vk/xr_preview_feed.h', 'gpu/vk/vk_replay.cpp', 'gpu/vk/vk_draw.cpp', 'gpu/vk/vk_shader.cpp', 'gpu/vk/vk_xr_shader_uniform_audit.cpp', 'gpu/vk/xr_shader_uniform_audit.h', 'gpu/vk/xr_uniform_camera_scan.h', 'gpu/vk/xr_eye_image_factory.h', 'gpu/vk/xr_eye_image_probe.h', 'gpu/vk/vk_xr_eye_images.cpp', 'gpu/vk/vk_vma.cpp', 'gpu/vk/vk_internal.h', 'tests/test_program_cache_cleanup.py', 'gpu/vk/vk_xr_camera.cpp', 'gpu/vk/xr_scene_camera.h', 'gpu/vk/xr_camera_submission.h', 'gpu/vk/xr_image_lineage.h', 'tests/test_vr_*.py', 'gpu/vk/xr_camera_capture.h', 'gpu/vk/vk_api.h', 'host/hos_main.c', 'host/rx_backend.c', 'host/vr_camera_read.h', 'gpu/vk/xr_camera_block_capture.h', 'tests/test_temporal_jitter.py', 'tests/temporal_jitter_test.cpp', 'tests/test_upscale_fallback.py', 'gpu/vk/vk_main.cpp', 'nx2/build.py', '.github/workflows/vr-bootstrap.yml']
  pull_request:
    paths: ['vr/**', 'gpu/vk/vk_xr.*', 'gpu/vk/vk_xr_session.h', 'gpu/vk/vk_xr_preview.h', 'gpu/vk/xr_preview_feed.h', 'gpu/vk/vk_replay.cpp', 'gpu/vk/vk_draw.cpp', 'gpu/vk/vk_shader.cpp', 'gpu/vk/vk_xr_shader_uniform_audit.cpp', 'gpu/vk/xr_shader_uniform_audit.h', 'gpu/vk/xr_uniform_camera_scan.h', 'gpu/vk/xr_eye_image_factory.h', 'gpu/vk/xr_eye_image_probe.h', 'gpu/vk/vk_xr_eye_images.cpp', 'gpu/vk/vk_vma.cpp', 'gpu/vk/vk_internal.h', 'tests/test_program_cache_cleanup.py', 'gpu/vk/vk_xr_camera.cpp', 'gpu/vk/xr_scene_camera.h', 'gpu/vk/xr_camera_submission.h', 'gpu/vk/xr_image_lineage.h', 'tests/test_vr_*.py', 'gpu/vk/xr_camera_capture.h', 'gpu/vk/vk_api.h', 'host/hos_main.c', 'host/rx_backend.c', 'host/vr_camera_read.h', 'gpu/vk/xr_camera_block_capture.h', 'tests/test_temporal_jitter.py', 'tests/temporal_jitter_test.cpp', 'tests/test_upscale_fallback.py', 'gpu/vk/vk_main.cpp', 'nx2/build.py', '.github/workflows/vr-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cmake -S vr -B work/vr-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build work/vr-build --config Release --parallel 2
      - run: ctest --test-dir work/vr-build -C Release --output-on-failure
